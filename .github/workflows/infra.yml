name: Infra

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'plan | apply'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write # azurerm provider authenticates via OIDC (azure/login)
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # azurerm provider auth via OIDC. azure/login exports ARM_* below; this
      # flips the provider into OIDC mode (no client secret).
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Terraform input variables (infra/envs/prod.tfvars is operator-only and
      # gitignored, so values come from repo secrets via TF_VAR_*).
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_pg_admin_login: ${{ secrets.PG_ADMIN_LOGIN }}
      TF_VAR_pg_admin_password: ${{ secrets.PG_ADMIN_PASSWORD }}
      TF_VAR_azure_ad_client_id: ${{ secrets.AZURE_AD_CLIENT_ID }}
      TF_VAR_azure_ad_client_secret: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
      TF_VAR_azure_ad_tenant_id: ${{ secrets.AZURE_AD_TENANT_ID }}
      TF_VAR_cron_org_id: ${{ secrets.CRON_ORG_ID }}
      TF_VAR_cron_sender_email: ${{ secrets.CRON_SENDER_EMAIL }}
      TF_VAR_admin_email_allowlist: ${{ secrets.ADMIN_EMAIL_ALLOWLIST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: infra
        run: terraform init

      - name: Validate
        working-directory: infra
        run: terraform validate

      # Variables come from the TF_VAR_* env above (repo secrets), NOT a tfvars
      # file — infra/envs/prod.tfvars is gitignored (operator-only), so it never
      # exists in CI. Referencing it here previously failed every infra PR with
      # "variables file does not exist".
      - name: Plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
        working-directory: infra
        run: terraform plan -no-color

      - name: Apply (manual gate)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        working-directory: infra
        run: terraform apply -auto-approve
