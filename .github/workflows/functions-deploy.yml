name: Edge Functions Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/functions-deploy.yml'

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Identify changed functions
        id: changed
        run: |
          mapfile -t fns < <(git diff --name-only HEAD~1 HEAD -- 'supabase/functions/*/index.ts' | awk -F'/' '{print $3}' | sort -u | grep -vE '^_')
          if [ "${#fns[@]}" -eq 0 ]; then
            echo "fns=" >> "$GITHUB_OUTPUT"
          else
            echo "fns=$(printf '%s ' "${fns[@]}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy functions
        if: steps.changed.outputs.fns != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in ${{ steps.changed.outputs.fns }}; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          done
