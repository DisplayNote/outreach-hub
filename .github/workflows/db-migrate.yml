name: DB Migrate

# There is a single cloud Supabase project (production); development uses the
# local Supabase CLI stack. Schema changes are tested locally (`supabase db
# reset` / `db diff`) and applied to prod manually here — never automatically on
# a main push — to guard against accidental prod schema deploys.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate-prod" to confirm pushing migrations to PRODUCTION'
        required: true

jobs:
  migrate-prod:
    if: inputs.confirm == 'migrate-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase db push
