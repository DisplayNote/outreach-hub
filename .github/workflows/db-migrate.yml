name: DB Migrate

# Applies SQL migrations to the PRODUCTION Azure Postgres Flexible Server via the
# node runner (scripts/migrate.mjs), which tracks applied files in public._migrations
# and (re)asserts app_user grants + password. Manual-only (never on a main push) to
# guard against accidental prod schema deploys. Connects as the server admin
# (DATABASE_URL_ADMIN); APP_USER_PASSWORD is the Key-Vault-generated app_user password.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate-prod" to confirm pushing migrations to PRODUCTION'
        required: true

jobs:
  migrate-prod:
    if: inputs.confirm == 'migrate-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to prod
        env:
          NODE_ENV: production
          # Admin (server owner) connection so migrations can manage roles/policies.
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
          # The app_user runtime password (Key-Vault-generated) the runner sets.
          APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD }}
        run: node scripts/migrate.mjs
